<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星期六加班｜人力計算系統</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tag{font-size:12px;background:#fef3c7;color:#92400e;padding:6px 9px;border-radius:999px;font-weight:800;white-space:nowrap}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}h2{font-size:18px;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);line-height:1.55}label{display:block;font-size:14px;font-weight:800;margin:16px 0 7px}input[type=date]{width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px}button{font:inherit;font-weight:800;cursor:pointer}.toggle{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:16px;font-size:18px}.toggle.open{background:#fff;color:var(--accent);border:2px solid var(--accent)}.panel{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.panel.show{display:block}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice label{margin:0}.choice input{display:none}.choice span{display:block;border:1px solid #d1d5db;border-radius:12px;padding:12px;text-align:center;font-weight:800}.choice input:checked+span{background:#111827;color:#fff;border-color:#111827}.people{display:flex;flex-direction:column;gap:10px;margin-top:8px}.employee-group{border:1px solid var(--line);border-radius:13px;padding:10px}.employee-group h3{margin:0 0 9px;padding-bottom:7px;border-bottom:2px solid;font-size:16px}.employee-group.one h3{color:#2563eb;border-color:#3b82f6}.employee-group.two h3{color:#0f9f9a;border-color:#14b8a6}.employee-group.paint h3{color:#ea580c;border-color:#f97316}.person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}.person input{width:20px;height:20px}.person-name{display:flex;align-items:center;gap:6px;font-weight:800}.area-badge{display:inline-flex;border-radius:999px;padding:2px 7px;color:#fff;font-size:11px;font-weight:900;line-height:1.45}.area-badge.one{background:#3b82f6}.area-badge.two{background:#14b8a6}.area-badge.paint{background:#f97316}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:15px;font-size:17px;margin-top:14px}.record-list{margin-top:14px;display:flex;flex-direction:column;gap:10px}.record{border:1px solid var(--line);border-radius:14px;padding:13px}.record.pending{border-color:#fcd34d;background:#fffbeb}.record.done{border-color:#bbf7d0;background:#f0fdf4}.record-head{display:flex;justify-content:space-between;gap:8px;font-weight:900}.badge{border-radius:999px;padding:3px 8px;font-size:12px;white-space:nowrap}.badge.pending{background:#fef3c7;color:#92400e}.badge.done{background:#dcfce7;color:#166534}.record-counts{font-size:14px;color:var(--muted);margin-top:7px}.finish-box{margin-top:12px;border-top:1px solid #fde68a;padding-top:10px}.note{font-size:12px;color:var(--muted);text-align:center;margin:15px 0 0}@media(max-width:480px){.person-grid{grid-template-columns:1fr}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="app">
    <div class="top"><div><h1>人力計算系統</h1><div class="hint">星期六加班</div></div><span class="tag">雲端同步</span></div>
    <section class="card">
      <h2>人力計算</h2><div class="hint">現場先建立加班人員單；主管之後再進來選下班時間並完成送出。</div>
      <button id="toggle" class="toggle" type="button">星期六加班</button>
      <div id="panel" class="panel">
        <label for="date">星期六日期</label><input id="date" type="date">
        <label>星期六上班人員（可複選）</label><div id="people" class="people"></div>
        <button id="create" class="primary" type="button">完成確認，建立加班單</button>
      </div>
      <h2 style="margin-top:18px">待主管確認</h2><div id="cloudStatus" class="hint">讀取雲端加班單中…</div><div id="records" class="record-list"></div>
      <p class="note">建立後會同步到雲端，主管可用另一支手機開啟此頁接續確認下班時間。</p>
    </section>
  </main>
  <script>
    const defaults={employees:[],employeeCategories:{}};
    const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const data=JSON.parse(localStorage.getItem('manpowerV1Data')||'null')||defaults;const category=name=>data.employeeCategories?.[name]||'1F';
    const SUPABASE_URL='https://wzhtuulpnbkgbruhzmuo.supabase.co';const SUPABASE_KEY='sb_publishable_ZG06eALOJ44uC6fNdXWHog_a3dBfzU-';const saturdayCloud=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});let saturdayRecords=[],activeRecordId=null;
    function counts(people){return {one:people.filter(n=>category(n)==='1F').length,two:people.filter(n=>category(n)==='2F').length,paint:people.filter(n=>category(n)==='烤漆').length}}function finishLabel(value){return value==='15:00'?'下午 3:00':value==='17:00'?'下午 5:00':''}function setCloudStatus(text,color=''){const el=$('cloudStatus');el.textContent=text;el.style.color=color}
    function render(){$('date').value=today();const groups=[['1F','1F','one'],['2F','2F','two'],['烤漆','烤漆','paint']];const markup=groups.map(([id,title,style])=>{const people=(data.employees||[]).filter(name=>category(name)===id);if(!people.length)return '';return `<section class="employee-group ${style}"><h3>${title}</h3><div class="person-grid">${people.map(name=>`<label class="person"><span class="person-name">${esc(name)}<span class="area-badge ${style}">${title}</span></span><input type="checkbox" value="${esc(name)}"></label>`).join('')}</div></section>`}).join('');$('people').innerHTML=markup||'<div class="hint">尚未讀到正式員工資料，請先到正式系統設定員工。</div>';renderRecords()}
    function renderRecords(){if(!saturdayRecords.length){$('records').innerHTML='<div class="hint">目前沒有待主管確認的星期六加班單。</div>';return}$('records').innerHTML=saturdayRecords.map(record=>{const c=counts(record.people||[]),pending=record.status!=='completed',active=activeRecordId===record.id;return `<section class="record ${pending?'pending':'done'}"><div class="record-head"><span>${esc(record.date)}｜加班 ${record.people.length} 人</span><span class="badge ${pending?'pending':'done'}">${pending?'待主管確認':'已完成'}</span></div><div class="record-counts">1F ${c.one} 人｜2F ${c.two} 人｜烤漆 ${c.paint} 人${record.finish?`｜下班：${esc(record.finish)}`:''}</div>${pending?`<button class="primary" style="margin-top:10px" data-open-finish="${record.id}" type="button">主管確認下班時間</button>${active?`<div class="finish-box"><label>確認下班時間</label><div class="choice"><label><input type="radio" name="finish" value="15:00"><span>下午 3:00 下班</span></label><label><input type="radio" name="finish" value="17:00"><span>下午 5:00 下班</span></label></div><button class="primary" data-submit-finish="${record.id}" type="button">完成送出</button></div>`:''}`:''}</section>`}).join('')}
    async function refreshRecords(){if(!saturdayCloud){setCloudStatus('雲端連線失敗','var(--bad)');return}setCloudStatus('讀取雲端加班單中…');const {data:rows,error}=await saturdayCloud.from('manpower_saturday_overtime_records').select('*').order('created_at',{ascending:false});if(error){setCloudStatus('雲端讀取失敗：'+error.message,'var(--bad)');return}saturdayRecords=(rows||[]).map(row=>({id:row.id,date:row.work_date,people:Array.isArray(row.people)?row.people:[],status:row.status,finish:finishLabel(row.finish_time)}));setCloudStatus('雲端資料已同步','var(--ok)');renderRecords()}
    async function createRecord(){const people=[...document.querySelectorAll('#people input:checked')].map(x=>x.value);if(!people.length){alert('請先勾選星期六上班人員');return}if(!saturdayCloud){alert('雲端尚未連線');return}const button=$('create');button.disabled=true;const {error}=await saturdayCloud.from('manpower_saturday_overtime_records').insert({work_date:$('date').value,people,status:'pending'});button.disabled=false;if(error){alert('建立加班單失敗：'+error.message);return}$('panel').classList.remove('show');$('toggle').classList.remove('open');$('toggle').textContent='星期六加班';await refreshRecords()}
    async function completeRecord(id){const finish=document.querySelector('input[name=finish]:checked')?.value;if(!finish){alert('請先選擇下班時間');return}const {error}=await saturdayCloud.from('manpower_saturday_overtime_records').update({status:'completed',finish_time:finish,completed_at:new Date().toISOString()}).eq('id',id);if(error){alert('完成送出失敗：'+error.message);return}activeRecordId=null;await refreshRecords()}
    $('toggle').onclick=()=>{const open=$('panel').classList.toggle('show');$('toggle').classList.toggle('open',open);$('toggle').textContent=open?'收起星期六加班':'星期六加班'};$('create').onclick=createRecord;$('records').onclick=e=>{const open=e.target.closest('[data-open-finish]'),submit=e.target.closest('[data-submit-finish]');if(open){activeRecordId=open.dataset.openFinish;renderRecords()}if(submit)completeRecord(submit.dataset.submitFinish)};render();refreshRecords();
  </script>
</body>
</html>
