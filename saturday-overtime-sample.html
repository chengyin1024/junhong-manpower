<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星期六加班樣品｜人力計算系統</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tag{font-size:12px;background:#fef3c7;color:#92400e;padding:6px 9px;border-radius:999px;font-weight:800;white-space:nowrap}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}h2{font-size:18px;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);line-height:1.55}label{display:block;font-size:14px;font-weight:800;margin:16px 0 7px}select,input[type=date]{width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px}button{font:inherit;font-weight:800;cursor:pointer}.toggle{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:16px;font-size:18px}.toggle.open{background:#fff;color:var(--accent);border:2px solid var(--accent)}.panel{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.panel.show{display:block}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice label{margin:0}.choice input{display:none}.choice span{display:block;border:1px solid #d1d5db;border-radius:12px;padding:12px;text-align:center;font-weight:800}.choice input:checked+span{background:#111827;color:#fff;border-color:#111827}.people{display:flex;flex-direction:column;gap:10px;margin-top:8px}.employee-group{border:1px solid var(--line);border-radius:13px;padding:10px}.employee-group h3{margin:0 0 9px;padding-bottom:7px;border-bottom:2px solid;font-size:16px}.employee-group.one h3{color:#2563eb;border-color:#3b82f6}.employee-group.two h3{color:#0f9f9a;border-color:#14b8a6}.employee-group.paint h3{color:#ea580c;border-color:#f97316}.person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}.person.absent{background:#fef2f2;border-color:#fecaca;color:#991b1b}.person input{width:20px;height:20px}.person-name{display:flex;align-items:center;gap:6px;font-weight:800}.area-badge{display:inline-flex;border-radius:999px;padding:2px 7px;color:#fff;font-size:11px;font-weight:900;line-height:1.45}.area-badge.one{background:#3b82f6}.area-badge.two{background:#14b8a6}.area-badge.paint{background:#f97316}.leave-badge{display:inline-flex;border-radius:999px;padding:2px 7px;background:#fee2e2;color:#b91c1c;font-size:11px;font-weight:900}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:15px;font-size:17px;margin-top:14px}.result{display:none;margin-top:14px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:15px}.result.show{display:block}.big{text-align:center;font-size:42px;font-weight:900;margin:5px 0}.status{text-align:center;font-weight:800}.finish-summary{text-align:center;margin:9px 0;color:#1d4ed8;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:23px}.note{font-size:12px;color:var(--muted);text-align:center;margin:15px 0 0}@media(max-width:480px){.person-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div><h1>人力計算系統</h1><div class="hint">星期六加班操作樣品</div></div><span class="tag">樣品，不影響正式資料</span></div>
    <section class="card">
      <h2>人力計算</h2><div class="hint">有星期六加班時才按下面按鈕，展開後選下班時間與實際上班人員。</div>
      <button id="toggle" class="toggle" type="button">星期六加班</button>
      <div id="panel" class="panel">
        <label for="date">星期六日期</label><input id="date" type="date">
        <label>下班時間</label><div class="choice"><label><input type="radio" name="finish" value="下午 3:00" checked><span>下午 3:00 下班</span></label><label><input type="radio" name="finish" value="下午 5:00"><span>下午 5:00 下班</span></label></div>
        <label>星期六上班人員（可複選）</label><div id="people" class="people"></div>
        <button id="confirm" class="primary" type="button">確認星期六加班</button>
        <div id="result" class="result"><div class="status" style="color:var(--ok)">已完成本次星期六加班選擇</div><div id="finishSummary" class="finish-summary"></div></div>
      </div>
      <p class="note">星期六預設全員不上班；只有你勾選的人會列為本次加班人員，不會計算人數或學生需求。</p>
    </section>
  </main>
  <script>
    const defaults={employees:[],employeeCategories:{}};
    const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const data=JSON.parse(localStorage.getItem('manpowerV1Data')||'null')||defaults;const category=name=>data.employeeCategories?.[name]||'1F';
    function render(){$('date').value=today();const groups=[['1F','1F','one'],['2F','2F','two'],['烤漆','烤漆','paint']];const markup=groups.map(([id,title,style])=>{const people=(data.employees||[]).filter(name=>category(name)===id);if(!people.length)return '';return `<section class="employee-group ${style}"><h3>${title}</h3><div class="person-grid">${people.map(name=>`<label class="person"><span class="person-name">${esc(name)}<span class="area-badge ${style}">${title}</span></span><input type="checkbox" value="${esc(name)}"></label>`).join('')}</div></section>`}).join('');$('people').innerHTML=markup||'<div class="hint">尚未讀到正式員工資料，請先到正式系統設定員工。</div>'}
    function confirmSaturdayOvertime(){const finish=document.querySelector('input[name=finish]:checked').value;$('finishSummary').textContent=`本次預計 ${finish} 下班`;$('result').classList.add('show')}
    $('toggle').onclick=()=>{const open=$('panel').classList.toggle('show');$('toggle').classList.toggle('open',open);$('toggle').textContent=open?'收起星期六加班':'星期六加班'};$('confirm').onclick=confirmSaturdayOvertime;render();
  </script>
</body>
</html>
