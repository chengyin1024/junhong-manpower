<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晚上加班｜人力計算系統</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--bad:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .app{max-width:760px;margin:auto;padding:14px 14px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.tag{font-size:12px;background:#e5e7eb;color:#374151;padding:6px 9px;border-radius:999px;font-weight:800;white-space:nowrap}.back{display:inline-block;margin-top:7px;color:#1d4ed8;font-size:13px;font-weight:800;text-decoration:none}
    .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}h2{font-size:18px;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);line-height:1.55}label{display:block;font-size:14px;font-weight:800;margin:16px 0 7px}select,input[type=date]{width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px}
    button{font:inherit;font-weight:800;cursor:pointer}.overtime-toggle{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:16px;font-size:18px}.overtime-toggle.open{background:#fff;color:var(--accent);border:2px solid var(--accent)}.panel{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.panel.show{display:block}.mode-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.mode-btn{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:13px 8px}.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.people{display:flex;flex-direction:column;gap:10px;margin-top:8px}.employee-group{border:1px solid var(--line);border-radius:13px;padding:10px}.employee-group h3{margin:0 0 9px;padding-bottom:7px;border-bottom:2px solid;font-size:16px}.employee-group.one h3{color:#2563eb;border-color:#3b82f6}.employee-group.two h3{color:#0f9f9a;border-color:#14b8a6}.employee-group.paint h3{color:#ea580c;border-color:#f97316}.person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}.person input{width:20px;height:20px}.person-name{display:flex;align-items:center;gap:6px;font-weight:800}.area-badge{display:inline-flex;border-radius:999px;padding:2px 7px;color:#fff;font-size:11px;font-weight:900;line-height:1.45}.area-badge.one{background:#3b82f6}.area-badge.two{background:#14b8a6}.area-badge.paint{background:#f97316}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:15px;font-size:17px;margin-top:14px}.result{display:none;margin-top:14px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:15px}.result.show{display:block}.big{text-align:center;font-size:42px;font-weight:900;margin:5px 0}.status{text-align:center;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:23px}.note{font-size:12px;color:var(--muted);text-align:center;margin:15px 0 0}@media(max-width:480px){.person-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div><h1>人力計算系統</h1><div class="hint">晚上加班</div><a class="back" href="index.html">← 回人力計算</a></div><span class="tag">獨立頁面</span></div>
    <section class="card">
      <h2>人力計算</h2>
      <div class="hint">先按下面的「晚上加班」，才會打開勾選人員與計算畫面。</div>
      <button id="overtimeToggle" class="overtime-toggle" type="button">晚上加班</button>
      <div id="overtimePanel" class="panel">
        <label for="sampleDate">加班日期</label><input id="sampleDate" type="date">
        <label>加班類型</label>
        <div class="mode-choice">
          <button class="mode-btn active" type="button" data-mode="all">全體加班</button>
          <button class="mode-btn" type="button" data-mode="assembly">組裝加班</button>
        </div>
        <div id="modeHint" class="hint" style="margin-top:8px">全體加班：可勾選 1F、2F、烤漆不加班人員。</div>
        <label for="product">產品</label><select id="product"></select>
        <label>今晚不加班的人（可複選）</label>
        <div id="people" class="people"></div>
        <button id="calculate" class="primary" type="button">計算晚上加班人數</button>
        <div id="result" class="result">
          <div class="status">晚上還需要學生</div>
          <div id="missing" class="big">0 人</div>
          <div id="status" class="status"></div>
          <div class="stats">
            <div class="stat"><small>晚上所需組裝人數</small><strong id="need">0</strong> 人</div>
            <div class="stat"><small>可加班 1F</small><strong id="available1F">0</strong> 人</div>
            <div class="stat"><small>可加班 2F</small><strong id="available2F">0</strong> 人</div>
            <div class="stat"><small id="paintLabel">可加班烤漆</small><strong id="availablePaint">0</strong> 人</div>
            <div class="stat"><small>自動扣除請假</small><strong id="automatic">0</strong> 人</div>
            <div class="stat"><small>勾選不加班</small><strong id="manual">0</strong> 人</div>
          </div>
        </div>
      </div>
      <p class="note">全體加班會顯示 1F／2F／烤漆；組裝加班只顯示 1F／2F。學生缺額只依 1F＋2F 組裝人力計算。</p>
    </section>
  </main>
  <script>
    const defaults={products:[{id:'p1',name:'260mm',base:39},{id:'p2',name:'310mm',base:39},{id:'p3',name:'13吋',base:36},{id:'p4',name:'200mm',base:36},{id:'p5',name:'410mm',base:37}],employees:[],employeeCategories:{}};
    const $=id=>document.getElementById(id);
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const data=JSON.parse(localStorage.getItem('manpowerV1Data')||'null')||defaults;
    const category=name=>data.employeeCategories?.[name]||'1F';
    const dateValue=()=>$('sampleDate').value||today();
    let overtimeMode='all';
    function tempAbsence(){const all=JSON.parse(localStorage.getItem('manpowerV1TempAbsenceByDate')||'{}');return all[dateValue()]||{}}
    function rangeLeaveNames(){const leaves=JSON.parse(localStorage.getItem('manpowerV1Leaves')||'[]');const d=dateValue();return new Set(leaves.filter(x=>x.start<=d&&d<=x.end).map(x=>x.name))}
    function render(){
      $('sampleDate').value=today();
      $('product').innerHTML=(data.products||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      const groups=overtimeMode==='all'?[['1F','1F','one'],['2F','2F','two'],['烤漆','烤漆','paint']]:[['1F','1F','one'],['2F','2F','two']];
      const markup=groups.map(([id,title,style])=>{
        const people=(data.employees||[]).filter(name=>category(name)===id);
        if(!people.length)return '';
        return `<section class="employee-group ${style}"><h3>${title}</h3><div class="person-grid">${people.map(name=>`<label class="person"><span class="person-name">${esc(name)}<span class="area-badge ${style}">${title}</span></span><input type="checkbox" value="${esc(name)}"></label>`).join('')}</div></section>`;
      }).join('');
      $('people').innerHTML=markup||'<div class="hint">尚未讀到正式員工資料，請先到正式系統設定員工。</div>';
    }
    function calculate(){
      const product=(data.products||[]).find(p=>p.id===$('product').value);if(!product)return;
      const includedGroups=overtimeMode==='all'?['1F','2F','烤漆']:['1F','2F'];
      const staff=(data.employees||[]).filter(name=>includedGroups.includes(category(name)));
      const manual=new Set([...document.querySelectorAll('#people input:checked')].map(x=>x.value));
      const temp=tempAbsence(),range=rangeLeaveNames();
      const automatic=new Set(staff.filter(name=>range.has(name)||temp[name]==='pm'||temp[name]==='full'));
      const unavailable=new Set([...manual,...automatic]);
      const availableFor=group=>staff.filter(name=>category(name)===group&&!unavailable.has(name)).length;
      const available1F=availableFor('1F'),available2F=availableFor('2F'),availablePaint=availableFor('烤漆');
      const availableAssembly=available1F+available2F,need=Number(product.base)||0,missing=Math.max(0,need-availableAssembly);
      $('need').textContent=need;$('available1F').textContent=available1F;$('available2F').textContent=available2F;$('availablePaint').textContent=availablePaint;$('paintLabel').textContent=overtimeMode==='all'?'可加班烤漆':'烤漆（未列入）';$('automatic').textContent=automatic.size;$('manual').textContent=[...manual].filter(name=>!automatic.has(name)).length;
      $('missing').textContent=`${missing} 人`;$('missing').style.color=missing?'var(--bad)':'var(--ok)';
      $('status').textContent=missing?`晚上還需要 ${missing} 位學生`:'晚上人力足夠，不需要學生';$('status').style.color=missing?'var(--bad)':'var(--ok)';$('result').classList.add('show');
    }
    $('overtimeToggle').onclick=()=>{const open=$('overtimePanel').classList.toggle('show');$('overtimeToggle').classList.toggle('open',open);$('overtimeToggle').textContent=open?'收起晚上加班':'晚上加班'};
    document.querySelectorAll('.mode-btn').forEach(button=>button.onclick=()=>{
      overtimeMode=button.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(item=>item.classList.toggle('active',item===button));
      $('modeHint').textContent=overtimeMode==='all'?'全體加班：可勾選 1F、2F、烤漆不加班人員。':'組裝加班：只計算並顯示 1F、2F 組裝人員。';
      $('result').classList.remove('show');
      render();
    });
    $('calculate').onclick=calculate;render();
  </script>
</body>
</html>
